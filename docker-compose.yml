  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     ConnectionStrings__DefaultConnection: "Host=postgres;Database=graphrag_db;Username=graphrag_user;Password=graphrag_password"
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - graphrag-network

volumes:
  postgres_data:
    driver: local

networks:
  graphrag-network:
    driver: bridge
