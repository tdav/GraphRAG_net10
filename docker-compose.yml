services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    container_name: graphrag-postgres
    environment:
      POSTGRES_DB: graphrag_db
      POSTGRES_USER: graphrag_user
      POSTGRES_PASSWORD: graphrag_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag_user -d graphrag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network

  # API service (to be implemented)
